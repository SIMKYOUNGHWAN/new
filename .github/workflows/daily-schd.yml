name: SCHD 일간 가격·분배금 갱신
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_schd -v
      - run: python -m app.schd
      - name: 검증된 실제 자료 저장
        run: |
          git add schd_data/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update SCHD actual data"
          git pull --rebase origin main
          git push
