name: 주요 통화 실제 환율 갱신
on:
  schedule:
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ECB 실제 환율 수집 및 분석
        run: python -m gel_app.major_pipeline
      - name: 실제 환율 스냅샷 저장
        run: |
          git add major_data/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update ECB major currency snapshot"
          git pull --rebase origin main
          git push

